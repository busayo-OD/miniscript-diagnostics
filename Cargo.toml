[package]
name = "miniscript-diagnostics"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Diagnostics for Miniscript satisfaction under a supplied spending context."
license = "CC0-1.0"
repository = "https://github.com/busayo-od/miniscript-diagnostics"
readme = "README.md"
keywords = ["bitcoin", "miniscript"]

[lib]
name = "miniscript_diagnostics"
path = "src/lib.rs"

[dependencies]
miniscript = "=13.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]